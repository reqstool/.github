name: Build (Python / Hatch)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      python-version:
        description: "Python version to use."
        required: false
        type: string
        default: "3.13"
      coverage-source:
        description: "Package name passed to --cov=<name>. Empty = run tests without coverage."
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Full history and tags: hatch-vcs derives the version from git state, so a
      # shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - run: pip install hatch

      - name: Run tests (with coverage)
        if: ${{ inputs.coverage-source != '' }}
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
        run: |
          hatch run dev:pytest \
            --junitxml=build/junit.xml \
            --cov="$COVERAGE_SOURCE" \
            --cov-report=xml:build/coverage.xml

      - name: Run tests (without coverage)
        if: ${{ inputs.coverage-source == '' }}
        run: hatch run dev:pytest --junitxml=build/junit.xml

      - name: Build
        run: hatch build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/
