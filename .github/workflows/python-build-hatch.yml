name: Build (Python / Hatch)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      python-version:
        description: "Python used for the build, coverage and dist (the latest release)."
        required: false
        type: string
        # renovate: datasource=python-version depName=python
        default: "3.15.2"
      python-versions:
        description: >
          JSON array of Python minors the test suite runs on, on Linux. The single
          place that defines the supported Python matrix for every reqstool repo.
        required: false
        type: string
        default: '["3.13","3.14","3.15"]'
      coverage-source:
        description: "Package name passed to --cov=<name>. Empty = run tests without coverage."
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs a build
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
      post-test-command:
        description: >
          Optional repo-specific command run through hatch's dev env after tests
          and build, before upload -- e.g. self-applying the project's own
          annotation processor into build/reqstool/annotations.yml.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # renovate: datasource=pypi depName=hatch
      - run: pip install hatch==1.18.2

      # Build first: e2e tests of plugins install the wheel/sdist from dist/.
      - run: hatch build

      - run: hatch run dev:pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Full history and tags: hatch-vcs derives the version from git state, so a
      # shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # renovate: datasource=pypi depName=hatch
      - run: pip install hatch==1.18.2

      # Build before the tests: e2e tests of plugins install the wheel/sdist from dist/.
      - name: Build
        run: hatch build

      - name: Run tests (with coverage)
        if: ${{ inputs.coverage-source != '' }}
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
        run: |
          hatch run dev:pytest \
            --junitxml=build/junit.xml \
            --cov="$COVERAGE_SOURCE" \
            --cov-report=xml:build/coverage.xml

      - name: Run tests (without coverage)
        if: ${{ inputs.coverage-source == '' }}
        run: hatch run dev:pytest --junitxml=build/junit.xml

      - name: Run post-test command
        if: ${{ inputs.post-test-command != '' }}
        env:
          POST_TEST_COMMAND: ${{ inputs.post-test-command }}
        run: eval "$POST_TEST_COMMAND"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/

      # build/ output (junit, coverage, annotations) for the reqstool verify job.
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-build
          path: ${{ inputs.working-directory }}/build/
