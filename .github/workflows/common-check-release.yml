name: Check Release

# Guards a release created by hand in the UI. The Release workflow enforces the
# same two rules *before* tagging; this is the backstop for the path that skips
# it entirely.

on:
  workflow_call:
    inputs:
      version-format:
        description: "Version format to validate: semver | pep440 | maven"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check ref is a tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/*) ;;
            *) echo "::error::Expected a tag ref (refs/tags/...) but got: $REF"; exit 1 ;;
          esac

      - uses: $/.github/actions/check-version
        with:
          version: ${{ github.ref_name }}
          version-format: ${{ inputs.version-format }}

      - uses: $/.github/actions/check-release-branch
        with:
          ref: ${{ github.event.release.target_commitish }}
