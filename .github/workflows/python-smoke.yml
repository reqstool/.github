name: Smoke (Python wheel, any OS)

# Installs the wheel produced by the Linux build job on a matrix of operating
# systems and runs a caller-supplied command against the caller's checkout.
# Deliberately does not use hatch: the point is to exercise the *installed*
# package the way a user gets it, and to keep hatch off Windows.

on:
  workflow_call:
    inputs:
      os:
        description: "JSON array of runner labels."
        required: false
        type: string
        default: '["windows-latest","macos-latest"]'
      python-version:
        description: >
          Python version. Minor only: exact patch releases are not published for
          every runner OS (3.13.18 exists for Linux, not for Windows/macOS).
        required: false
        type: string
        default: "3.13"
      dist-artifact:
        description: "Name of the artifact holding the wheel (see python-build-hatch.yml artifact-name)."
        required: false
        type: string
        default: "dist"
      requirements:
        description: "Extra pip requirements installed next to the wheel, space separated (e.g. pytest)."
        required: false
        type: string
        default: ""
      command:
        description: "bash command run from the repo root after the wheel is installed."
        required: true
        type: string
      ref:
        description: "Branch, tag or SHA to check out. Empty = the caller's ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist

      - name: Install wheel
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          # Run from a directory without the source tree on sys.path is not
          # needed: src-layout projects do not shadow the installed wheel.
          # shellcheck disable=SC2086
          pip install dist/*.whl $REQUIREMENTS

      - name: Run command
        env:
          SMOKE_COMMAND: ${{ inputs.command }}
        run: eval "$SMOKE_COMMAND"
