name: Lint (Python)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use. Empty = tool-versions.yml in reqstool/.github."
        required: false
        type: string
        default: ""
      package-manager:
        description: "Package manager: hatch or poetry."
        required: false
        type: string
        default: "hatch"
      poetry-version:
        description: "Poetry version (only used when package-manager is poetry)."
        required: false
        type: string
        default: "2.1.0"

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # tool-versions.yml at the commit of *this* reusable workflow, so the version
      # is pinned by whatever SHA the caller pins this workflow to.
      - name: Read tool versions
        uses: actions/checkout@v7.0.1
        with:
          repository: reqstool/.github
          ref: ${{ github.job_workflow_sha }}
          path: .reqstool-github
          sparse-checkout: tool-versions.yml
          persist-credentials: false

      - name: Resolve Python version
        id: tv
        env:
          INPUT_VERSION: ${{ inputs.python-version }}
        run: |
          v="${INPUT_VERSION:-$(sed -n 's/^python: *"\(.*\)"/\1/p' .reqstool-github/tool-versions.yml)}"
          echo "python=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ steps.tv.outputs.python }}

      - name: Install hatch and lint
        if: ${{ inputs.package-manager == 'hatch' }}
        run: |
          # renovate: datasource=pypi depName=hatch
          pip install hatch==1.18.2
          hatch run dev:black --check --verbose src tests
          hatch run dev:flake8

      - name: Install Poetry
        if: ${{ inputs.package-manager == 'poetry' }}
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ inputs.poetry-version }}
          virtualenvs-create: true

      - name: Install poetry-dynamic-versioning and dependencies
        if: ${{ inputs.package-manager == 'poetry' }}
        run: |
          poetry self add "poetry-dynamic-versioning[plugin]"
          poetry install --with dev

      - name: Lint with Poetry
        if: ${{ inputs.package-manager == 'poetry' }}
        run: |
          poetry run black --check --verbose src tests
          poetry run flake8
