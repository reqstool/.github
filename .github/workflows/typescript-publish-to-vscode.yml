name: Publish VS Code Extension

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Validate packaging without uploading to the registry."
        required: false
        type: boolean
        default: false
      version:
        description: "Stamp package.json with this version before packaging. Empty = leave as-is."
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to package from. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment to deploy to. Empty = none."
        required: false
        type: string
        default: ""
      dependency-version:
        description: "Version of a bundled external tool to pin (e.g. a CLI version). Empty = use package.json default."
        required: false
        type: string
        default: ""
      dependency-name:
        description: "The npm package.json key that holds the bundled tool's version (e.g. reqstoolVersion)."
        required: false
        type: string
        default: ""
      registries:
        description: "Comma-separated list of registries to publish to. Valid values: 'open-vsx', 'vscode-marketplace'. Default: both."
        required: false
        type: string
        default: "open-vsx,vscode-marketplace"
      azure-credential:
        description: >
          Authenticate to the VS Code Marketplace with Microsoft Entra ID instead of
          VSCE_PAT. Azure DevOps retires global PATs on 2026-12-01 -- see
          reqstool/.github#98. Enabling this needs Entra set up for the publisher first,
          and likely an azure/login step and id-token: write on this job.
        required: false
        type: boolean
        default: false
    secrets:
      OPEN_VSX_TOKEN:
        required: false
      VSCE_PAT:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # read, not write: the release flow attaches the VSIX via
    # common-release-assets.yml before this runs, so nothing here writes to the
    # release. A dry-run caller could not grant write without over-privileging
    # a packaging check.
    permissions:
      contents: read
    steps:
      # `ref` is caller-supplied and this job runs the project's build with
      # publish credentials, so constrain it before the checkout. Not
      # check-release-branch: these legitimately check out a tag.
      - uses: $/.github/actions/check-version
        with:
          version: ${{ inputs.ref }}
          version-format: semver

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - run: npm ci

      # Without this the VSIX carries whatever placeholder package.json holds --
      # `0.0.0-dev` in reqstool-vscode -- and every published extension reports
      # that version regardless of what was released. Must run before the build:
      # `npm run build` is what packages the VSIX.
      - name: Stamp the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Pin dependency version
        if: ${{ inputs.dependency-version != '' && inputs.dependency-name != '' }}
        env:
          DEP_NAME: ${{ inputs.dependency-name }}
          DEP_VERSION: ${{ inputs.dependency-version }}
        run: npm pkg set "${DEP_NAME}=${DEP_VERSION}"

      - name: Log effective dependency version
        if: ${{ inputs.dependency-name != '' }}
        env:
          DEP_NAME: ${{ inputs.dependency-name }}
        run: |
          VALUE=$(node -p "require('./package.json')[process.env.DEP_NAME] || '(not set)'")
          echo "$DEP_NAME: $VALUE"

      - name: Build VSIX
        run: npm run build

      - name: Get VSIX path
        id: vsix
        run: echo "path=$(find . -maxdepth 1 -name '*.vsix' | head -1)" >> "$GITHUB_OUTPUT"

      # Published with each registry's own CLI rather than a third-party action.
      # HaaLeo/publish-vscode-extension declares `pat` as required, so it cannot
      # reach Entra ID -- which is what replaces the PAT Azure DevOps retires on
      # 2026-12-01. It also still declares node20 and has had no commit since
      # 2025-06. See reqstool/.github#98.
      #
      # Both CLIs come from the extension's own devDependencies via `npm ci`
      # above -- `vsce` already builds the VSIX -- so their versions are pinned
      # in its lockfile and tracked by Renovate rather than floating here.
      #
      # A `run:` step also uses the job's Node, so there is no `using:`
      # declaration to be deprecated out from under us.
      - name: Dry-run — report what would be published
        if: ${{ inputs.dry-run }}
        env:
          VSIX_PATH: ${{ steps.vsix.outputs.path }}
          REGISTRIES: ${{ inputs.registries }}
        run: |
          set -euo pipefail
          if [ ! -s "$VSIX_PATH" ]; then
            echo "::error::No VSIX was produced at '$VSIX_PATH'."
            exit 1
          fi
          echo "Would publish $VSIX_PATH ($(du -h "$VSIX_PATH" | cut -f1)) to: $REGISTRIES"

      - name: Publish to Open VSX Registry
        if: ${{ contains(inputs.registries, 'open-vsx') && !inputs.dry-run }}
        env:
          # ovsx reads the token from OVSX_PAT; passing it as an argument would
          # put it in the process list. Open VSX is Eclipse-run and unaffected
          # by the Azure DevOps PAT retirement.
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          VSIX_PATH: ${{ steps.vsix.outputs.path }}
        run: npx --no-install ovsx publish "$VSIX_PATH"

      - name: Publish to VS Code Marketplace
        if: ${{ contains(inputs.registries, 'vscode-marketplace') && !inputs.dry-run }}
        env:
          # vsce reads the token from VSCE_PAT, and ignores it under
          # --azure-credential.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ steps.vsix.outputs.path }}
          AZURE_CREDENTIAL: ${{ inputs.azure-credential }}
        run: |
          set -euo pipefail
          if [ "$AZURE_CREDENTIAL" = "true" ]; then
            npx --no-install vsce publish --azure-credential --packagePath "$VSIX_PATH"
          else
            npx --no-install vsce publish --packagePath "$VSIX_PATH"
          fi
