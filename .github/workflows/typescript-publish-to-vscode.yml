name: Publish VS Code Extension

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Validate packaging without uploading to the registry."
        required: false
        type: boolean
        default: false
      version:
        description: "Stamp package.json with this version before packaging. Empty = leave as-is."
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to package from. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment to deploy to. Empty = none."
        required: false
        type: string
        default: ""
      dependency-version:
        description: "Version of a bundled external tool to pin (e.g. a CLI version). Empty = use package.json default."
        required: false
        type: string
        default: ""
      dependency-name:
        description: "The npm package.json key that holds the bundled tool's version (e.g. reqstoolVersion)."
        required: false
        type: string
        default: ""
      registries:
        description: "Comma-separated list of registries to publish to. Valid values: 'open-vsx', 'vscode-marketplace'. Default: both."
        required: false
        type: string
        default: "open-vsx,vscode-marketplace"
    secrets:
      OPEN_VSX_TOKEN:
        required: false
      VSCE_PAT:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # read, not write: the release flow attaches the VSIX via
    # common-release-assets.yml before this runs, so nothing here writes to the
    # release. A dry-run caller could not grant write without over-privileging
    # a packaging check.
    permissions:
      contents: read
    steps:
      # `ref` is caller-supplied and this job runs the project's build with
      # publish credentials, so constrain it before the checkout. Not
      # check-release-branch: these legitimately check out a tag.
      - uses: $/.github/actions/check-version
        with:
          version: ${{ inputs.ref }}
          version-format: semver

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Without this the VSIX carries whatever placeholder package.json holds --
      # `0.0.0-dev` in reqstool-vscode -- and every published extension reports
      # that version regardless of what was released. Must run before the build:
      # `npm run build` is what packages the VSIX.
      - name: Stamp the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Pin dependency version
        if: ${{ inputs.dependency-version != '' && inputs.dependency-name != '' }}
        env:
          DEP_NAME: ${{ inputs.dependency-name }}
          DEP_VERSION: ${{ inputs.dependency-version }}
        run: npm pkg set "${DEP_NAME}=${DEP_VERSION}"

      - name: Log effective dependency version
        if: ${{ inputs.dependency-name != '' }}
        env:
          DEP_NAME: ${{ inputs.dependency-name }}
        run: |
          VALUE=$(node -p "require('./package.json')[process.env.DEP_NAME] || '(not set)'")
          echo "$DEP_NAME: $VALUE"

      - name: Build VSIX
        run: npm run build

      - name: Get VSIX path
        id: vsix
        run: echo "path=$(find . -maxdepth 1 -name '*.vsix' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX Registry
        if: ${{ contains(inputs.registries, 'open-vsx') }}
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.vsix.outputs.path }}
          dryRun: ${{ inputs.dry-run }}

      - name: Publish to VS Code Marketplace
        if: ${{ contains(inputs.registries, 'vscode-marketplace') }}
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.vsix.outputs.path }}
          dryRun: ${{ inputs.dry-run }}
