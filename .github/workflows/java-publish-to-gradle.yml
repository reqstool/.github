name: Publish via Gradle

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      target:
        description: "Publish target: portal (Gradle Plugin Portal) or central (Maven Central / Sonatype)."
        required: true
        type: string
      java-version:
        description: "Java version to use."
        required: false
        type: string
        default: "21"
      ref:
        description: "Branch, tag or SHA to publish from. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Assert the project resolves to this version before publishing. Empty = no check."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Build without publishing (./gradlew build -x test). No credentials needed."
        required: false
        type: boolean
        default: false
      environment:
        description: "GitHub environment to deploy to. Empty = none."
        required: false
        type: string
        default: ""
    secrets:
      GRADLE_PUBLISH_KEY:
        required: false
      GRADLE_PUBLISH_SECRET:
        required: false
      REQSTOOL_PRIVATE_GPG_KEY:
        required: false
      REQSTOOL_PRIVATE_GPG_PASSPHRASE:
        required: false
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      # Full history and tags: git-dyn-semver derives the version from git state,
      # and a shallow clone would publish the wrong number rather than fail.
      # `ref` is caller-supplied and this job runs the project's build with
      # publish credentials, so constrain it before the checkout. Not
      # check-release-branch: these legitimately check out a tag.
      - uses: $/.github/actions/check-version
        with:
          version: ${{ inputs.ref }}
          version-format: maven

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      # Catches the build and the tag disagreeing before anything reaches the
      # portal -- most often a shallow clone, which makes git-dyn-semver compute
      # a version rather than fail.
      - name: Assert the resolved version
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          RESOLVED=$(./gradlew printVersion -q | tail -1)
          echo "Resolved version: $RESOLVED"
          if [ -n "$EXPECTED" ] && [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::Project resolves to '$RESOLVED' but '$EXPECTED' was requested — refusing to publish."
            exit 1
          fi

      - name: Dry-run build
        if: ${{ inputs.dry-run }}
        run: ./gradlew build -x test

      - name: Publish to Gradle Plugin Portal
        if: ${{ !inputs.dry-run && inputs.target == 'portal' }}
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Publish to Maven Central (Sonatype)
        if: ${{ !inputs.dry-run && inputs.target == 'central' }}
        run: ./gradlew publish
        env:
          REQSTOOL_PRIVATE_GPG_KEY: ${{ secrets.REQSTOOL_PRIVATE_GPG_KEY }}
          REQSTOOL_PRIVATE_GPG_PASSPHRASE: ${{ secrets.REQSTOOL_PRIVATE_GPG_PASSPHRASE }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
