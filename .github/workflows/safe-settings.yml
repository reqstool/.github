name: safe-settings

on:
  push:
    branches: [main]
    paths:
      - "safe-settings/**"
  schedule:
    - cron: "0 0 * * MON"
  workflow_dispatch:
    inputs:
      nop:
        description: "Preview only, no writes (currently broken upstream, see README)"
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # safe-settings authenticates as its own GitHub App, so the workflow
    # token only ever needs to read this repo's config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: github/safe-settings
          ref: 2.1.18
          path: .safe-settings

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: npm ci
        working-directory: .safe-settings

      - name: Apply settings
        run: npm run full-sync
        working-directory: .safe-settings
        env:
          GH_ORG: reqstool
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          ADMIN_REPO: .github
          CONFIG_PATH: safe-settings
          DEPLOYMENT_CONFIG_FILE: ${{ github.workspace }}/safe-settings/deployment-settings.yml
          # safe-settings reads FULL_SYNC_NOP. There is no DRY_RUN variable --
          # the name it replaces did nothing, so every run wrote for real.
          FULL_SYNC_NOP: ${{ inputs.nop && 'true' || 'false' }}
          # At the default level a run that reverted a setting and one that did
          # nothing log the same couple of lines. With NOP mode crashing, debug
          # output is the only account of what a sync actually did.
          LOG_LEVEL: debug
