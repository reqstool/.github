name: Publish to npm

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      dry-run:
        description: "Run npm publish --dry-run."
        required: false
        type: boolean
        default: false
      scope:
        description: "npm scope (with @, e.g. @reqstool)."
        required: false
        type: string
        default: "@reqstool"
      access:
        description: "npm publish access level."
        required: false
        type: string
        default: "public"
      version:
        description: "Version to publish. Empty = the tag, when the caller ran on one."
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to publish from. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      environment:
        description: "GitHub environment to deploy to. Empty = none."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Defence in depth. The release flow only ever passes a tag it just
      # created on a validated branch, but this workflow takes `ref` from its
      # caller and then runs the project's own build with signing keys and
      # registry credentials in scope. Constraining it to something
      # version-shaped, before the checkout, keeps an arbitrary branch or SHA
      # from reaching that. (`check-release-branch` is the wrong guard here:
      # these legitimately check out a tag, which it rejects.)
      - uses: $/.github/actions/check-version
        with:
          version: ${{ inputs.ref }}
          version-format: semver

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: ${{ inputs.scope }}

      - run: npm ci

      # npm has no equivalent of hatch-vcs, so the version has to be written into
      # package.json by hand. `version` is what the release flow passes; the tag
      # covers a publish triggered by a release event.
      - name: Set the version
        if: ${{ inputs.version != '' || github.ref_type == 'tag' }}
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - name: Publish
        if: ${{ !inputs.dry-run }}
        env:
          ACCESS: ${{ inputs.access }}
        run: npm publish --provenance --access "$ACCESS"

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          ACCESS: ${{ inputs.access }}
        run: npm publish --provenance --access "$ACCESS" --dry-run
