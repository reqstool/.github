name: Lint (Java)

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK version to use."
        required: false
        type: string
        # renovate: datasource=java-version depName=java
        default: "25"
      build-tool:
        description: "Build tool: maven or gradle."
        required: false
        type: string
        default: "maven"

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Version derivation (Nisse / git-dyn-semver) reads git state.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Check formatting (Maven)
        if: ${{ inputs.build-tool == 'maven' }}
        run: mvn --batch-mode clean validate

      - name: Check formatting (Gradle)
        if: ${{ inputs.build-tool == 'gradle' }}
        run: ./gradlew --console=plain checkFormat
