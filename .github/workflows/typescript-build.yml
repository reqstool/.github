name: Build (TypeScript)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version to use."
        required: false
        type: string
        default: "24"
      use-xvfb:
        description: "Wrap test commands with xvfb-run (required for VS Code extension tests)."
        required: false
        type: boolean
        default: false
      dependency-version:
        description: "Version of an external tool to install before tests (e.g. a CLI the extension bundles). Empty = skip."
        required: false
        type: string
        default: ""
      dependency-install-command:
        description: >
          Shell command to install the dependency. Use {version} as a placeholder
          for the dependency-version value (e.g. 'pipx install mytool=={version}').
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before building. Empty = leave as-is."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci

      # npm has no equivalent of hatch-vcs, so the tag has to be written into
      # package.json by hand. Done here rather than at publish time because the
      # VSIX is produced by `npm run build` below -- stamping afterwards would
      # leave the artifact carrying the repo's placeholder version.
      - name: Stamp the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The command is `eval`ed by design -- callers supply their own installer
      # line. Read from the environment rather than interpolated into the script
      # body so the value cannot terminate the surrounding shell construct.
      - name: Install dependency
        if: ${{ inputs.dependency-version != '' && inputs.dependency-install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.dependency-install-command }}
          DEP_VERSION: ${{ inputs.dependency-version }}
        run: |
          CMD="${INSTALL_COMMAND/\{version\}/$DEP_VERSION}"
          eval "$CMD"

      - name: Run tests
        if: ${{ !inputs.use-xvfb }}
        run: npm run test

      - name: Run tests (headless display)
        if: ${{ inputs.use-xvfb }}
        run: |
          xvfb-run --auto-servernum npm run test-with-report
          xvfb-run --auto-servernum npm run test:ui

      - run: npm run build

      - name: Upload VSIX artifact
        if: ${{ hashFiles(format('{0}/*.vsix', inputs.working-directory)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: "${{ inputs.working-directory }}/*.vsix"

      - name: Upload dist artifact
        if: ${{ hashFiles(format('{0}/*.vsix', inputs.working-directory)) == '' && hashFiles(format('{0}/dist/**', inputs.working-directory)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/
