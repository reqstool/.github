name: Build (TypeScript)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js used for the build and the artifacts (the latest LTS)."
        required: false
        type: string
        # renovate: datasource=node-version depName=node
        default: "26"
      node-versions:
        description: >
          JSON array of Node.js versions the test suite runs on, on Linux. One entry
          by policy (latest LTS); adding a leg is a one-line change.
        required: false
        type: string
        default: '["26"]'
      use-xvfb:
        description: "Wrap test commands with xvfb-run (required for VS Code extension tests)."
        required: false
        type: boolean
        default: false
      dependency-version:
        description: "Version of an external tool to install before tests (e.g. a CLI the extension bundles). Empty = skip."
        required: false
        type: string
        default: ""
      dependency-install-command:
        description: >
          Shell command to install the dependency. Use {version} as a placeholder
          for the dependency-version value (e.g. 'pipx install mytool=={version}').
        required: false
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs a build
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
      post-test-command:
        description: >
          Optional repo-specific bash command run after build and tests, before
          upload -- e.g. e2e tests against dist/ and self-applying the project's
          own tags processor into build/reqstool/annotations.yml.
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before building. Empty = leave as-is."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Install dependency
        if: ${{ inputs.dependency-version != '' && inputs.dependency-install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.dependency-install-command }}
          DEP_VERSION: ${{ inputs.dependency-version }}
        run: |
          CMD="${INSTALL_COMMAND/\{version\}/$DEP_VERSION}"
          eval "$CMD"

      - name: Run tests
        if: ${{ !inputs.use-xvfb }}
        run: npm run test

      - name: Run tests (headless display)
        if: ${{ inputs.use-xvfb }}
        run: |
          xvfb-run --auto-servernum npm run test-with-report
          xvfb-run --auto-servernum npm run test:ui

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci

      # npm has no equivalent of hatch-vcs, so the tag has to be written into
      # package.json by hand. Done here rather than at publish time because the
      # VSIX is produced by `npm run build` below -- stamping afterwards would
      # leave the artifact carrying the repo's placeholder version.
      - name: Stamp the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependency
        if: ${{ inputs.dependency-version != '' && inputs.dependency-install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.dependency-install-command }}
          DEP_VERSION: ${{ inputs.dependency-version }}
        run: |
          CMD="${INSTALL_COMMAND/\{version\}/$DEP_VERSION}"
          eval "$CMD"

      - run: npm run build

      - name: Run tests
        if: ${{ !inputs.use-xvfb }}
        run: npm run test

      - name: Run tests (headless display)
        if: ${{ inputs.use-xvfb }}
        run: |
          xvfb-run --auto-servernum npm run test-with-report
          xvfb-run --auto-servernum npm run test:ui

      - name: Run post-test command
        if: ${{ inputs.post-test-command != '' }}
        env:
          POST_TEST_COMMAND: ${{ inputs.post-test-command }}
        run: eval "$POST_TEST_COMMAND"

      # A dist/ tree carries the version in no filename, which is what
      # common-release-assets.yml asserts against. `npm pack` is npm's analog of
      # a wheel; packed into dist/ so the uploaded artifact stays flat.
      - name: Pack the npm tarball
        if: ${{ inputs.version != '' && hashFiles(format('{0}/*.vsix', inputs.working-directory)) == '' }}
        run: npm pack --pack-destination dist

      - name: Upload VSIX artifact
        if: ${{ hashFiles(format('{0}/*.vsix', inputs.working-directory)) != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: "${{ inputs.working-directory }}/*.vsix"

      - name: Upload dist artifact
        if: ${{ hashFiles(format('{0}/*.vsix', inputs.working-directory)) == '' && hashFiles(format('{0}/dist/**', inputs.working-directory)) != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-build
          path: ${{ inputs.working-directory }}/build/
          if-no-files-found: ignore
