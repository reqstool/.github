name: Build (Gradle)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      java-version:
        description: "JDK version to use."
        required: false
        type: string
        default: "21"
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs a build
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Full history and tags: the version is derived from git state by
      # git-dyn-semver, so a shallow clone would build the wrong number rather
      # than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - run: ./gradlew clean build

      - name: Report the resolved version
        run: ./gradlew printVersion -q

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/build/libs/*.jar
          if-no-files-found: ignore
