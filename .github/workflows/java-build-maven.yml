name: Build (Maven)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      java-version:
        description: "JDK used for the build and the artifacts (the latest LTS)."
        required: false
        type: string
        # renovate: datasource=java-version depName=java
        default: "25"
      java-versions:
        description: >
          JSON array of JDKs the test suite runs on, on Linux. One entry by policy
          (latest LTS); adding a leg is a one-line change.
        required: false
        type: string
        default: '["25"]'
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs a build
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
      post-test-command:
        description: >
          Optional repo-specific bash command run after tests, before upload --
          e.g. self-applying the project's own annotation processor into
          target/reqstool/annotations.yml.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - run: mvn --batch-mode clean verify

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: Report the resolved version
        run: mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout

      - name: Run post-test command
        if: ${{ inputs.post-test-command != '' }}
        env:
          POST_TEST_COMMAND: ${{ inputs.post-test-command }}
        run: eval "$POST_TEST_COMMAND"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ inputs.working-directory }}/target/*.jar
            ${{ inputs.working-directory }}/target/*.pom
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-build
          path: ${{ inputs.working-directory }}/target/
