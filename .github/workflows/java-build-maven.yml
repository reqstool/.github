name: Build (Maven)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      java-version:
        description: "JDK version to use."
        required: false
        type: string
        default: "21"
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Full history and tags: the version is derived from git state by Nisse,
      # so a shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - run: mvn --batch-mode clean verify

      - name: Report the resolved version
        run: mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            ${{ inputs.working-directory }}/target/*.jar
            ${{ inputs.working-directory }}/target/*.pom
          if-no-files-found: ignore
