name: Publish to GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use for Antora."
        required: false
        type: string
        default: "24"
      antora-playbook:
        description: "Path to the Antora playbook file."
        required: false
        type: string
        default: "docs/antora-playbook.yml"
      site-path:
        description: "Directory the playbook writes the site to."
        required: false
        type: string
        default: "docs/build/site"

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # Same action common-build-docs.yml uses, so what is validated on a PR and
      # what is published are built by the same Antora.
      - uses: $/.github/actions/build-antora-site
        with:
          playbook: ${{ inputs.antora-playbook }}

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ inputs.site-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
