name: Publish to Maven Central

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project root relative to repo root. Default '.' for repo-root projects."
        required: false
        type: string
        default: "."
      java-version:
        description: "Java version to use."
        required: false
        type: string
        default: "21"
      ref:
        description: "Branch, tag or SHA to publish from. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Assert the project resolves to this version before deploying. Empty = no check."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Build without deploying (mvn package -DskipTests). No GPG or token needed."
        required: false
        type: boolean
        default: false
      environment:
        description: "GitHub environment to deploy to. Empty = none."
        required: false
        type: string
        default: ""
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_TOKEN:
        required: false
      REQSTOOL_PRIVATE_GPG_KEY:
        required: false
      REQSTOOL_PRIVATE_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    steps:
      # Full history and tags: Nisse derives the version from git state, and a
      # shallow clone would deploy the wrong number rather than fail.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java (dry-run)
        if: ${{ inputs.dry-run }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Set up Java (publish)
        if: ${{ !inputs.dry-run }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.REQSTOOL_PRIVATE_GPG_KEY }}
          gpg-passphrase: REQSTOOL_PRIVATE_GPG_PASSPHRASE

      # Catches the build and the tag disagreeing before anything reaches the
      # registry -- most often a shallow clone, which makes Nisse compute a
      # version rather than fail.
      - name: Assert the resolved version
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          RESOLVED=$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Resolved version: $RESOLVED"
          if [ -n "$EXPECTED" ] && [ "$RESOLVED" != "$EXPECTED" ]; then
            echo "::error::Project resolves to '$RESOLVED' but '$EXPECTED' was requested — refusing to publish."
            exit 1
          fi

      - name: Dry-run build
        if: ${{ inputs.dry-run }}
        run: mvn --batch-mode clean package -DskipTests

      - name: Publish to Maven Central
        if: ${{ !inputs.dry-run }}
        run: mvn --batch-mode clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          REQSTOOL_PRIVATE_GPG_PASSPHRASE: ${{ secrets.REQSTOOL_PRIVATE_GPG_PASSPHRASE }}
