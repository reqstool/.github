name: Test — python-publish-to-pypi

on:
  workflow_call:

# Tests for .github/workflows/python-publish-to-pypi.yml.
# Dry-run mode (twine check) against fake dist artifacts, once per target.

permissions:
  contents: read

jobs:
  dry-run-pypi:
    uses: ./.github/workflows/python-publish-to-pypi.yml
    with:
      target: pypi
      dry-run: true
    permissions:
      id-token: write

  dry-run-testpypi:
    uses: ./.github/workflows/python-publish-to-pypi.yml
    with:
      target: testpypi
      dry-run: true
    permissions:
      id-token: write
