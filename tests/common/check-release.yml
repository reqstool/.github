name: Test — common-check-release

on:
  workflow_call:

# Happy-path tests for .github/workflows/common-check-release.yml.
# The rules it enforces are tested directly by tests/actions/run-tests.sh, which
# runs the scripts behind check-version and check-release-branch over both the
# accept and the reject cases.

permissions:
  contents: read

jobs:
  valid-semver:
    uses: ./.github/workflows/common-check-release.yml
    with:
      version-format: semver

  valid-pep440:
    uses: ./.github/workflows/common-check-release.yml
    with:
      version-format: pep440

  valid-maven:
    uses: ./.github/workflows/common-check-release.yml
    with:
      version-format: maven
