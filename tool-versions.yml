# Single source of truth for the toolchain versions used by every reqstool repo's CI.
# Read by the shared workflows (pinned to the SHA of the called workflow) and bumped
# by Renovate. Policy: Java and Node on the latest LTS, Python on the latest release.
#
# renovate: datasource=python-version depName=python
python: "3.13.18"
# renovate: datasource=node-version depName=node
node: "26.13.1"
# renovate: datasource=java-version depName=java
java: "21.0.12+8.0.LTS"
