# Per-repo override for reqstool-client.
#
# Appends this repo's own required contexts to the `protect-main` ruleset.
# safe-settings merges arrays by name and `rules` by `type`, so these UNION
# with the org-wide contexts in suborgs/all.yml rather than replacing them.
#
# Contexts are the INTERSECTION of a human PR (#453) and a Renovate PR (#451).
# `renovate/stability-days` reports only on Renovate's own PRs, so requiring it
# would block every human PR here forever. The intersection also drops
# path-filtered contexts (build-docs.yml runs only on `docs/**`), which would
# otherwise hang any PR that does not touch docs.
rulesets:
  - name: protect-main
    rules:
      - type: required_status_checks
        parameters:
          # Both keys are required by the ruleset schema, in every file.
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "Analyze (javascript-typescript)"
            - context: "Analyze (python)"
            - context: "Reuse linting job / linting"
            - context: "build"
            - context: "check / Validate PR title"
