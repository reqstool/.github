# Per-repo override for reqstool-ai.
#
# The FULL required-context list lives here, not split with suborgs/all.yml.
# A ruleset may hold only one rule of each type, and a required_status_checks
# rule in all.yml plus one here does not combine into a single rule -- see the
# note in all.yml. Keep every context for this repo in this file.
#
# Contexts are the INTERSECTION of a human PR (#44) and a Renovate PR (#53).
# `renovate/stability-days` reports only on Renovate's own PRs, so requiring it
# would block every human PR here forever. The intersection also drops
# path-filtered contexts (build-docs.yml runs only on `docs/**`), which would
# otherwise hang any PR that does not touch docs.
rulesets:
  - name: protect-main
    rules:
      - type: required_status_checks
        parameters:
          # Both keys are required by the ruleset schema.
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "Analyze (actions)"
            - context: "Analyze (javascript-typescript)"
            - context: "CodeQL"
            - context: "DCO"
            - context: "validate"
