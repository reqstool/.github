# Per-repo override for reqstool-java-maven-plugin.
#
# Appends a required_status_checks rule to the `protect-main` ruleset in
# suborgs/all.yml. safe-settings merges arrays by name and `rules` by `type`,
# so the other four rules are left untouched.
#
# Contexts are the INTERSECTION of a human PR (#189) and a Renovate PR (#192) --
# never the union. `renovate/stability-days` reports only on Renovate's own PRs,
# so requiring it would block every human PR on this repo forever. Taking the
# intersection also drops path-filtered contexts (build-docs.yml runs only on
# `docs/**`), which would otherwise hang any PR that does not touch docs.
rulesets:
  - name: protect-main
    rules:
      - type: required_status_checks
        parameters:
          # Both keys are required by the ruleset schema.
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "Analyze (actions)"
            - context: "Analyze (java-kotlin)"
            - context: "Analyze (javascript-typescript)"
            - context: "Check linting / linting"
            - context: "CodeQL"
            - context: "DCO"
            - context: "build (main)"
            - context: "build (pypi)"
            - context: "check / Validate PR title"
            - context: "validate-openspec / Validate OpenSpec specs"
